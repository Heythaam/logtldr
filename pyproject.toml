[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logtldr"
version = "0.1.0"
description = "Summarize logs with LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "MAJDADDIN" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "drain3",
    "httpx",
    "litellm",
    "pydantic",
]

[project.optional-dependencies]
tracing = [
    "langfuse",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-PyYAML",
    "pytest-socket",
]


[project.urls]
Homepage = "https://github.com/MAJDADDIN/logtldr"
Repository = "https://github.com/MAJDADDIN/logtldr"
Issues = "https://github.com/MAJDADDIN/logtldr/issues"

[project.scripts]
logtldr = "logtldr.main:_entry"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
logtldr = ["direct_causes.yaml"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
addopts = "-ra"
markers = [
    "disable_socket: block all network sockets (requires pytest-socket)",
]


[[tool.mypy.overrides]]
module = ["drain3.*", "litellm.*", "tiktoken.*"]
ignore_missing_imports = true